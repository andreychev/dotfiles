# Native bootstrap and macOS defaults require this mise version.
min_version = "2026.9.1"

[env]
NODE_OPTIONS="--max_old_space_size=1536"

[tools]
go = "1.26.1"
node = "22.22.2"
python = "3.11.11"
uv = "latest"
"npm:yarn" = "1.22.22"
"npm:npm" = "latest"
"npm:pnpm" = "10.33.0"
"npm:sql-formatter" = "latest"
rust = "stable"

[settings]
idiomatic_version_file_enable_tools = ["node"]

# Homebrew remains the package owner; do not duplicate Brewfiles in bootstrap.packages.
[bootstrap.hooks.pre-packages]
run = '/bin/bash "${XDG_CONFIG_HOME:-$HOME/.config}/mise/bootstrap" packages'

[bootstrap.hooks.pre-defaults]
run = "osascript -e 'tell application \"System Settings\" to quit'"

[bootstrap.hooks.post-defaults]
run = '/bin/bash "${XDG_CONFIG_HOME:-$HOME/.config}/mise/bootstrap" defaults'

# Native bootstrap installs [tools] before running this task.
[tasks.bootstrap]
description = "Restore app preferences and finish machine setup"
dir = "{{env.HOME}}"
run = '/bin/bash "${XDG_CONFIG_HOME:-$HOME/.config}/mise/bootstrap" finish'

[tasks."update:mise"]
description = "Update the mise.run binary without updating plugins"
dir = "{{env.HOME}}"
raw = true
run = '"$HOME/.local/bin/mise" self-update --no-plugins'

[tasks."update:tools"]
description = "Update mise tools within configured version constraints"
dir = "{{env.HOME}}"
run = '"$HOME/.local/bin/mise" upgrade'

[tasks."update:brew"]
description = "Update Homebrew packages and clean downloads"
dir = "{{env.HOME}}"
run = "brew update && brew upgrade && brew cleanup"

[tasks."update:zsh"]
description = "Update antidote shell plugins"
dir = "{{env.HOME}}"
run = '. "$HOME/.xdg.dirs"; zsh "${ANTIDOTE_HOME:-$XDG_CACHE_HOME/repos}/mattmc3/antidote/antidote" update'

[tasks."update:nvim"]
description = "Synchronize Neovim plugins"
dir = "{{env.HOME}}"
run = 'nvim --headless "+Lazy! sync" +qa'

# Keep OS updates explicit, separate from other maintenance tasks.
[tasks."update:macos"]
description = "Install macOS software updates (may require a restart)"
dir = "{{env.HOME}}"
raw = true
run = "sudo softwareupdate -i -a"
